[project]
name = "curso-java"
version = "0.1.0"
description = "Documentation about JAVA"
authors = [
    {name = "Josef Leyva",email = "jalm_x@hotmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mkdocs-material (>=9.7.6,<10.0.0)",
    "pymdown-extensions (>=10.21.3,<11.0.0)",
    "python-markdown-math (>=0.9,<0.10)",
    "pygments (>=2.20.0,<3.0.0)"
]

[tool.poetry.dependencies]
python = "^3.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"